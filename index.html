<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050507">
<title>GhOuL music</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Golos+Text:wght@400;500;600&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body data-theme="ghoul">

<!-- SVG-иконки (тонкая линия) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-home" viewBox="0 0 24 24"><path d="M3.5 11 12 3.5l8.5 7.5v9a1 1 0 0 1-1 1H15v-6.5H9V20.5H4.5a1 1 0 0 1-1-1z"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20.5 20.5-4.5-4.5"/></symbol>
  <symbol id="i-lib" viewBox="0 0 24 24"><path d="M4 4v16M9 4v16M13.5 6.5l6 13.5"/></symbol>
  <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4.5 21c1-4 4-6 7.500-6s6.500 2 7.500 6"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 4.800v14.400a.6.6 0 0 0 .9.5l11.800-7.200a.6.6 0 0 0 0-1L8.900 4.300a.6.6 0 0 0-.9.500z" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24"><rect x="5.500" y="4" width="4.500" height="16" rx="1.600" fill="currentColor" stroke="none"/><rect x="14" y="4" width="4.500" height="16" rx="1.600" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-next" viewBox="0 0 24 24"><path d="M6 5.200v13.600a.5.5 0 0 0 .8.4l9.400-6.800a.5.5 0 0 0 0-.8L6.800 4.800a.5.5 0 0 0-.8.400z" fill="currentColor" stroke="none"/><path d="M19 5v14"/></symbol>
  <symbol id="i-prev" viewBox="0 0 24 24"><path d="M18 5.200v13.600a.5.5 0 0 1-.8.400l-9.400-6.800a.5.5 0 0 1 0-.8l9.400-6.800a.5.5 0 0 1 .8.400z" fill="currentColor" stroke="none"/><path d="M5 5v14"/></symbol>
  <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 20s-8-5-8-11a4.500 4.500 0 0 1 8-2.700A4.500 4.500 0 0 1 20 9c0 6-8 11-8 11z"/></symbol>
  <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.400" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.400" fill="currentColor" stroke="none"/><circle cx="19" cy="12" r="1.400" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-shuffle" viewBox="0 0 24 24"><path d="M3 7h4l10 10h4M3 17h4l3-3M14 10l3-3h4M18 4l3 3-3 3M18 14l3 3-3 3"/></symbol>
  <symbol id="i-repeat" viewBox="0 0 24 24"><path d="M4 11V9a3 3 0 0 1 3-3h13M17 3l3 3-3 3M20 13v2a3 3 0 0 1-3 3H4M7 21l-3-3 3-3"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
  <symbol id="i-lyrics" viewBox="0 0 24 24"><path d="M4 6h16M4 12h10M4 18h13"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-wave" viewBox="0 0 24 24"><path d="M3 12h2M7 7v10M11 3v18M15 8v8M19 10v4"/></symbol>
  <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></symbol>
  <symbol id="i-file" viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6zM14 3v4h4"/></symbol>
  <!-- новые -->
  <symbol id="i-sparkle" viewBox="0 0 24 24"><path d="M12 2c.7 5.500 4.500 9.300 10 10-5.500.7-9.300 4.500-10 10-.7-5.500-4.500-9.300-10-10 5.500-.7 9.300-4.500 10-10z"/></symbol>
  <symbol id="i-flame" viewBox="0 0 24 24"><path d="M12 2.500c.8 3.700 5.500 5.800 5.500 10.800a5.500 5.500 0 0 1-11 0c0-2.200 1.100-3.500 2.200-4.600.2 1.600 1 2.300 1.900 2.500C10.200 8.300 10.700 5.200 12 2.500z"/><path d="M12 21.300c-1.600 0-2.700-1.100-2.700-2.600 0-1.300 1-2 2.700-3.700 1.700 1.700 2.700 2.400 2.700 3.700 0 1.500-1.100 2.600-2.700 2.600z"/></symbol>
  <symbol id="i-list" viewBox="0 0 24 24"><rect x="4" y="3.500" width="16" height="17" rx="2.500"/><path d="M8 9h8M8 13h8M8 17h4.500"/></symbol>
  <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M4.500 12h15M13.500 6l6 6-6 6"/></symbol>
  <symbol id="i-chev" viewBox="0 0 24 24"><path d="m9 5.500 6.500 6.500L9 18.500"/></symbol>
  <symbol id="i-eq" viewBox="0 0 24 24"><path d="M5 19v-5M9.500 19V6M14.500 19V9.500M19 19v-8"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M19.500 12h-15M10.500 6l-6 6 6 6"/></symbol>
</svg>

<canvas id="stars" aria-hidden="true"></canvas>

<div id="app">
  <header id="top">
    <button class="brand" data-go="home" aria-label="GhOuL music — на главную"><b class="silver">GhOuL</b><em>music</em></button>
    <div class="top-r">
      <button id="syncBadge" class="chip" hidden></button>
      <button class="ico" data-go="search" aria-label="Поиск"><svg><use href="#i-search"/></svg></button>
    </div>
  </header>

  <main id="view" tabindex="-1"></main>

  <div id="mini" class="rim" hidden>
    <div class="mini-progress"><i id="miniBar"></i></div>
    <button class="mini-main" id="miniOpen" aria-label="Открыть плеер">
      <img id="miniArt" alt="">
      <span class="mini-text"><b id="miniTitle"></b><small id="miniArtist"></small></span>
    </button>
    <button class="ico" id="miniPlay" aria-label="Пауза/играть"><svg><use href="#i-play"/></svg></button>
    <button class="ico" id="miniNext" aria-label="Следующий"><svg><use href="#i-next"/></svg></button>
  </div>

  <nav id="nav">
    <button data-go="home" class="on"><svg><use href="#i-home"/></svg><span>Главная</span></button>
    <button data-go="search"><svg><use href="#i-search"/></svg><span>Поиск</span></button>
    <button data-go="library"><svg><use href="#i-lib"/></svg><span>Библиотека</span></button>
    <button data-go="profile"><svg><use href="#i-user"/></svg><span>Профиль</span></button>
  </nav>
</div>

<!-- Полноэкранный плеер -->
<section id="player" aria-hidden="true">
  <div class="p-top">
    <button class="ico" id="pClose" aria-label="Свернуть"><svg><use href="#i-down"/></svg></button>
    <span class="p-label" id="pSource">Сейчас играет</span>
    <button class="ico" id="pMore" aria-label="Действия"><svg><use href="#i-more"/></svg></button>
  </div>
  <div class="p-body">
    <div class="stage" id="stage">
      <svg class="orbit p-orbit" viewBox="0 0 400 400" aria-hidden="true">
        <g transform="rotate(-16 200 200)"><ellipse cx="200" cy="200" rx="196" ry="62" class="o1"/><circle r="3.500" class="dot"><animateMotion dur="16s" repeatCount="indefinite" path="M4 200a196 62 0 1 0 392 0a196 62 0 1 0 -392 0"/></circle></g>
        <g transform="rotate(22 200 200)"><ellipse cx="200" cy="200" rx="178" ry="48" class="o2"/><circle r="2.500" class="dot"><animateMotion dur="23s" repeatCount="indefinite" path="M22 200a178 48 0 1 1 356 0a178 48 0 1 1 -356 0"/></circle></g>
      </svg>
      <div class="disc" id="disc"><img id="pArt" alt=""><i class="hole"></i></div>
      <canvas id="viz" width="640" height="160"></canvas>
    </div>
    <div class="lyrics" id="lyrics" hidden></div>
    <div class="p-meta">
      <div><h2 id="pTitle"></h2><p id="pArtist"></p></div>
      <button class="ico big" id="pFav" aria-label="В избранное"><svg><use href="#i-heart"/></svg></button>
    </div>
    <div class="seek">
      <input type="range" id="seek" min="0" max="1000" value="0" aria-label="Перемотка">
      <div class="times"><span id="tCur">0:00</span><span id="tDur">0:00</span></div>
    </div>
    <div class="ctrl">
      <button class="ico" id="pShuffle" aria-label="Перемешать"><svg><use href="#i-shuffle"/></svg></button>
      <button class="ico" id="pPrev" aria-label="Назад"><svg><use href="#i-prev"/></svg></button>
      <button class="play" id="pPlay" aria-label="Играть"><svg><use href="#i-play"/></svg></button>
      <button class="ico" id="pNext" aria-label="Вперёд"><svg><use href="#i-next"/></svg></button>
      <button class="ico" id="pRepeat" aria-label="Повтор"><svg><use href="#i-repeat"/></svg></button>
    </div>
    <div class="p-tools">
      <button class="chip" id="pLyricsBtn"><svg><use href="#i-lyrics"/></svg>Текст</button>
      <button class="chip" id="pQueueBtn"><svg><use href="#i-lib"/></svg>Очередь</button>
    </div>
  </div>
</section>

<!-- Универсальный нижний лист -->
<div id="sheetWrap" hidden><div id="sheetBack"></div><div id="sheet" role="dialog" aria-modal="true"></div></div>
<div id="toast" role="status" aria-live="polite"></div>
<audio id="audio" preload="metadata"></audio>
<input type="file" id="filePick" accept="audio/*" multiple hidden>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
  </html>
